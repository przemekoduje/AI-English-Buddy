<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>przemokoduje.com</title>
  <link rel="icon" type="image/png" href="https://przemokoduje.com/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .hub-wrapper {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    .hub-brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
      text-decoration: none;
    }

    .apps-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.15rem;
      padding: 2.75rem 1.5rem;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      text-decoration: none;
      color: #0f172a;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .app-tile:hover {
      transform: translateY(-4px);
      border-color: #0f172a;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    .tile-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .app-tile:hover .tile-icon {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    .tile-name {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .tile-arrow {
      color: #94a3b8;
      display: flex;
      align-items: center;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .app-tile:hover .tile-arrow {
      color: #0f172a;
      transform: translateX(3px);
    }

    @media (max-width: 720px) {
      .apps-grid {
        grid-template-columns: 1fr;
        max-width: 340px;
      }

      .app-tile {
        flex-direction: row;
        justify-content: flex-start;
        padding: 1.25rem 1.4rem;
      }

      .tile-arrow {
        margin-left: auto;
      }
    }
  </style>
</head>
<body>
  <main class="hub-wrapper">
    <a href="/" class="hub-brand">przemokoduje.com</a>

    <section class="apps-grid" aria-label="Aplikacje">
      <a href="/speakling" class="app-tile tile-speakling">
        <div class="tile-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </div>
        <span class="tile-name">Speakling</span>
        <span class="tile-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </span>
      </a>

      <a href="/keepgoals/" class="app-tile">
        <div class="tile-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
        </div>
        <span class="tile-name">KeepGoals</span>
        <span class="tile-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </span>
      </a>

      <a href="/autopilot/" class="app-tile">
        <div class="tile-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <span class="tile-name">Autopilot</span>
        <span class="tile-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </span>
      </a>
    </section>
  </main>

  <script>
    (function() {
      var isPhoneDevice = /Mobi|Android.*Mobile|iPhone|iPod/i.test(navigator.userAgent) ||
                          (window.screen && Math.min(window.screen.width, window.screen.height) <= 500);
      var isMobileViewport = window.innerWidth < 768;

      if (isPhoneDevice || isMobileViewport) {
        var speaklingTile = document.querySelector('.tile-speakling');
        if (speaklingTile) {
          speaklingTile.setAttribute('href', '/speakling/mobile/');
        }
      }
    })();
  </script>
</body>
</html>
